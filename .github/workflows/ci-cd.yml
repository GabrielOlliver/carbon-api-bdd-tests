name: CI/CD - Carbon API

# Quando o pipeline roda
on:
  push:
    branches: [main]          # todo push na main -> CI + CD
  pull_request:
    branches: [main]          # PR contra a main -> somente CI (sem deploy)
  workflow_dispatch:          # botao "Run workflow" manual na aba Actions

# Permissoes minimas do GITHUB_TOKEN: ler o codigo e publicar a imagem no GHCR
permissions:
  contents: read
  packages: write

jobs:
  # ==================================================================
  # CI 1/2 - Compila a solucao e executa os testes automatizados
  # ==================================================================
  build-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore das dependencias
        run: dotnet restore CarbonApi.sln

      - name: Build (Release)
        run: dotnet build CarbonApi.sln -c Release --no-restore

      - name: Testes automatizados
        run: >
          dotnet test CarbonApi.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Publicar relatorio de testes
        if: always()            # publica mesmo se algum teste falhar
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  # ==================================================================
  # CI 2/2 - Build da imagem Docker e publicacao no GitHub Container Registry
  # ==================================================================
  docker-image:
    name: Build e Publicacao da Imagem
    runs-on: ubuntu-latest
    needs: build-test           # so roda se build e testes passarem
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Definir nome e tag da imagem
        id: meta
        run: |
          # GHCR exige nome minusculo; a tag e o SHA curto do commit (rastreabilidade)
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${REPO}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=${REPO}:latest"         >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}   # PR so valida o build
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha  # reaproveita camadas entre execucoes
          cache-to: type=gha,mode=max

  # ==================================================================
  # CD 1/2 - Deploy automatico em STAGING
  # ==================================================================
  deploy-staging:
    name: Deploy Staging
    needs: docker-image
    # So faz deploy em push/manual na main e quando a VM ja estiver configurada
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VM_HOST != ''
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      aspnetcore_environment: Staging
      api_port: 8081
      db_port: 1522
      image: ${{ needs.docker-image.outputs.image }}
    secrets: inherit

  # ==================================================================
  # CD 2/2 - Deploy em PRODUCAO (exige aprovacao manual no environment)
  # ==================================================================
  deploy-production:
    name: Deploy Producao
    needs: [docker-image, deploy-staging]   # so promove o que passou em staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.VM_HOST != ''
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      aspnetcore_environment: Production
      api_port: 8080
      db_port: 1521
      image: ${{ needs.docker-image.outputs.image }}
    secrets: inherit
