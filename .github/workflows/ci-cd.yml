name: CI - Testes Automatizados (Carbon API)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==================================================================
  # 1) Build da solucao + testes unitarios (xUnit + Moq, sem banco)
  # ==================================================================
  build-test:
    name: Build e Testes Unitarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore e build (Release)
        run: |
          dotnet restore CarbonApi.sln
          dotnet build CarbonApi.sln -c Release --no-restore

      - name: Testes unitarios
        run: >
          dotnet test tests/CarbonApi.Tests/CarbonApi.Tests.csproj -c Release --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Publicar resultado dos testes unitarios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes-unitarios
          path: TestResults

  # ==================================================================
  # 2) Testes BDD de API (Reqnroll + Gherkin) contra a stack real
  #    API + Oracle sobem com docker compose dentro do runner
  # ==================================================================
  bdd-tests:
    name: Testes BDD de API (Gherkin + JSON Schema)
    runs-on: ubuntu-latest
    needs: build-test
    env:
      API_BASE_URL: http://localhost:8080
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Gerar .env efemero (senhas aleatorias, so para este run)
        run: |
          cat > .env <<ENV
          ORACLE_PASSWORD=Ora$(openssl rand -hex 8)
          APP_USER=carbon_app
          APP_USER_PASSWORD=App$(openssl rand -hex 8)
          JWT_SECRET=$(openssl rand -hex 32)
          ASPNETCORE_ENVIRONMENT=Development
          API_PORT=8080
          DB_PORT=1521
          ENV

      - name: Subir a stack (API + Oracle)
        run: docker compose up -d --build

      - name: Aguardar a API ficar pronta (/health/ready)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health/ready; then echo ""; echo "API pronta"; exit 0; fi
            echo "Aguardando API + Oracle... ($i/60)"; sleep 10
          done
          docker compose logs --tail=100
          exit 1

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Executar cenarios BDD
        run: >
          dotnet test tests/CarbonApi.BddTests/CarbonApi.BddTests.csproj -c Release
          --logger "trx;LogFileName=bdd-tests.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Publicar relatorios (TRX + HTML do Reqnroll)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-bdd
          path: |
            TestResults
            tests/CarbonApi.BddTests/bin/Release/net8.0/reqnroll_report.html

      - name: Logs da API (somente em caso de falha)
        if: failure()
        run: docker compose logs --tail=200 carbon-api

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v
