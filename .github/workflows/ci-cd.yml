name: CI/CD - Carbon API

# Quando o pipeline roda
on:
  push:
    branches: [main]          # todo push na main
  pull_request:
    branches: [main]          # todo PR aberto contra a main
  workflow_dispatch:          # botao "Run workflow" manual na aba Actions

jobs:
  # ==================================================================
  # CI 1/2 - Compila a solucao e executa os testes automatizados
  # ==================================================================
  build-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore das dependencias
        run: dotnet restore CarbonApi.sln

      - name: Build (Release)
        run: dotnet build CarbonApi.sln -c Release --no-restore

      - name: Testes automatizados
        run: >
          dotnet test CarbonApi.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Publicar relatorio de testes
        if: always()            # publica mesmo se algum teste falhar
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  # ==================================================================
  # CI 2/2 - Garante que a imagem Docker continua construindo
  # ==================================================================
  docker-build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: build-test           # so roda se build e testes passarem
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false           # na Fase 5 passa a publicar no GHCR
          tags: carbon-api:ci-${{ github.sha }}
          cache-from: type=gha  # reaproveita camadas entre execucoes
          cache-to: type=gha,mode=max
