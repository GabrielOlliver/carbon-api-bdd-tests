#cloud-config
# Executado automaticamente no primeiro boot da VM no Azure.
package_update: true
runcmd:
  # Docker Engine + plugin Docker Compose (script oficial)
  - curl -fsSL https://get.docker.com | sh
  # Permite ao usuario de deploy usar o docker sem sudo
  - usermod -aG docker azureuser
  # 4 GB de swap: folga de memoria para os dois Oracle (staging + producao)
  - fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
